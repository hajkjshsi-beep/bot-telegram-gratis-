name: Run TG Bot Auto-Clean

on:
  schedule:
    - cron: '0 */6 * * *' # Jalan tiap 6 jam sekali
  workflow_dispatch: # Bisa dipencet manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # IZIN MENULIS BALIK KE REPO
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Deps
        run: pip install telethon pandas openpyxl

      - name: List Files for Debugging
        run: ls -la

      - name: Run Script
        env:
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TELETHON_STRING_SESSION: ${{ secrets.TELETHON_STRING_SESSION }}
        run: python bot.py

      - name: Save Results & State to Repo
        if: always() # Tetap jalankan meskipun script error/crash
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # TAMBAHKAN SEMUA FILE PENTING DI SINI
          # hasil.csv -> Log eksekusi
          # links_diakses.json -> Daftar link yang sudah dicoba (ANTI-ULANG)
          # join_state.json -> Hitungan join harian
          # daftar_bersih_auto.csv -> Data hasil parsing (opsional, bisa dihapus jika tidak perlu)
          
          git add hasil.csv links_diakses.json join_state.json || true
          
          # Cek apakah ada perubahan nyata sebelum commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update results & state $(date)"
            # Force push untuk menghindari konflik jika ada race condition
            git push origin HEAD:${{ github.ref_name }} --force
          fi
