name: Run TG Bot Auto-Clean

on:
  schedule:
    - cron: '0 */6 * * *' # Jalan tiap 6 jam sekali
  workflow_dispatch: # Bisa dipencet manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Deps
        run: pip install telethon pandas openpyxl

      - name: Check Raw Data Existence
        run: |
          if [ ! -f start_links.csv ]; then
            echo "ERROR: File start_links.csv tidak ditemukan di root repo!"
            exit 1
          fi
          wc -l start_links.csv

      - name: Run Script
        env:
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TELETHON_STRING_SESSION: ${{ secrets.TELETHON_STRING_SESSION }}
        run: python bot.py

      - name: Save Results
        if: always()
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # Tambahkan file hasil dan file pembersih sementara jika ada
          git add hasil.csv join_state.json daftar_bersih_auto.csv || true
          
          # Cek apakah ada perubahan yang siap commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update results $(date)"
            git push origin HEAD:${{ github.ref_name }} --force
          fi
