name: Run TG Bot

on:
  schedule:
    - cron: '0 */6 * * *' # Jalan tiap 6 jam sekali
  workflow_dispatch: # Bisa dipencet manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Deps
        run: pip install telethon pandas openpyxl

      - name: Run Script
        env:
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TELETHON_STRING_SESSION: ${{ secrets.TELETHON_STRING_SESSION }}
        run: python bot.py

      - name: Save Results
        if: always()
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add hasil.csv join_state.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update results $(date)"
          git push origin HEAD:${{ github.ref_name }} || true
